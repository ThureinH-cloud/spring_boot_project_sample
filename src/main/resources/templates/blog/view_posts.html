<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
    <div class="" th:replace="blog/header :: header"></div>
    <div class="container">
        <div class="d-flex">
            <div class="col-md-9 mx-3">
                <div class="" th:if="${posts.isEmpty()}">
                    <p class="text-center my-3">No Posts Here</p>
                </div>
                <div class="card my-3" th:each="post:${posts}">
                    <div class="card-header">
                        <a th:href="@{/post/{postUrl}(postUrl=${post.url})}" th:text="${post.title}"></a>
                        <h4 class="fw-bold" th:text="${#temporals.format(post.createdAt,'dd MMM yyyy')}"></h4>
                    </div>
                    <div class="card-body">
                        <div class="flex">
                            <p th:text="${post.shortDescription}"></p>
                            <a href="">Read more</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 my-3">
                <div class="card">
                    <div class="card-header">Blog Search</div>
                    <div class="card-body">

                            <form th:action="@{/page/search}">
                                <div class="input-group">
                                    <input type="text" name="query" class="form-control">
                                    <button type="submit" class="btn btn-primary">Search</button>
                                </div>
                            </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
