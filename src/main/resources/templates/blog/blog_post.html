<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
    <div class="" th:replace="blog/header :: header"></div>
    <div class="container">
        <div class="col-md-9">
            <h3 th:text="${post.title}"></h3>
            <hr>
            <h4 th:text="${post.shortDescription}"></h4>
            <hr>
            <div th:utext="${post.content}"></div>
        </div>
    </div>
    <div class="container">
        <div class="col-md-9">
            <h4>Comments</h4>
            <div class="card" th:object="${comment}">
                <h3 class="card-header">Leave a comment</h3>
                <div class="card-body">
                    <form th:action="@{/{postUrl}/comments(postUrl=${post.url})}" method="post">
                        <input th:field="*{name}" name="name" type="text" class="form-control my-2" placeholder="Enter name">
                        <p th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></p>
                        <input th:field="*{email}" name="email" type="email" class="form-control my-2" placeholder="Enter email">
                        <p th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></p>
                        <textarea th:field="*{content}" name="content" class="form-control my-2" placeholder="Enter comment" id="" cols="30" rows="10"></textarea>
                        <input type="submit" class="btn btn-primary" value="Submit">
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
