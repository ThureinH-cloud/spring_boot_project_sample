<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
<div th:replace="admin/header :: header">

</div>
<div class="container">
    <h2 class="">List Blog Posts</h2>
    <div class="col-md-5 my-2">
        <form th:action="@{/admin/posts/search}">
            <div class="input-group">
                <input name="query" type="text" class="form-control">
                <button class="btn btn-primary">Search</button>
            </div>
        </form>
    </div>
    <table class="table  table-striped">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Post Title</th>
                <th>Post Short Description</th>
                <th>Post Created On</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="post:${posts}">
                <td th:text="${post.id}"></td>
                <td th:text="${post.title}"></td>
                <td th:text="${post.shortDescription}"></td>
                <td th:text="${post.createdAt}"></td>
                <td>
                    <a th:href="@{/admin/posts/{postId}/edit(postId=${post.id})}" class="btn btn-primary">Edit</a>
                    <a th:href="@{/admin/posts/{postId}/delete(postId=${post.id})}" class="btn btn-danger">Delete</a>
                    <a th:href="@{/admin/posts/{postUrl}/view(postUrl=${post.url})}" class="btn btn-info">View</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
