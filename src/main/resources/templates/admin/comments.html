<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
    <div class="" th:replace="admin/header :: header"></div>
    <div class="container">
        <h3 class="my-2">List of Comments</h3>

        <table class="table table-striped">
            <thead class="table-header table-dark">
                <tr>
                    <th>#</th>
                    <th>Email</th>
                    <th>Comment</th>
                    <th>Created On</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="comment:${comments}">
                    <td th:text="${comment.id}"></td>
                    <td th:text="${comment.email}"></td>
                    <td th:text="${comment.content}"></td>
                    <td th:text="${#temporals.format(comment.createdAt,'dd MMM yyyy')}"></td>
                    <td>
                        <a th:href="@{/admin/{commentId}/delete(commentId=${comment.id})}" class="btn btn-danger">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
