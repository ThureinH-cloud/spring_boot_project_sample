<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/44.1.0/ckeditor5.css">
</head>
<body>
    <div class="" th:replace="/admin/header :: header"></div>
    <div class="container">
        <div class="col-md-8 offset-md-2">
            <div class="card p-3">
                <h2 class="card-header text-center">Create Post</h2>
                <div class="card-body">
                    <form th:action="@{/admin/posts/{postId}(postId=${post.id})}" method="post" th:object="${post}">
                        <div class="mb-3">
                            <label>Title</label>
                            <input type="text" class="form-control" name="title" th:field="*{title}" placeholder="Enter Title">
                            <p th:if="${#fields.hasErrors('title')}" class="text-danger" th:errors="*{title}"></p>
                        </div>
                        <div class="mb-3">
                            <label>Short Description</label>
                            <textarea name="shortDescription" class="form-control" th:field="*{shortDescription}" id="" cols="20" rows="10"></textarea>
                            <p th:if="${#fields.hasErrors('shortDescription')}" class="text-danger" th:errors="*{shortDescription}"></p>
                        </div>
                        <div class="mb-3">
                            <label>Content</label>
                            <textarea id="content" name="content" class="form-control" th:field="*{content}"  cols="30" rows="10"></textarea>
                            <p th:if="${#fields.hasErrors('content')}" class="text-danger" th:errors="*{content}"></p>
                        </div>
                        <input type="submit" value="Update" class="btn btn-primary">
                    </form>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.ckeditor.com/ckeditor5/44.1.0/ckeditor5.umd.js"></script>
    <script>
        const {
            ClassicEditor,
            Essentials,
            Bold,
            Italic,
            Font,
            Paragraph
        } = CKEDITOR;

            .create( document.querySelector( '#content' ), {
                licenseKey: 'eyJhbGciOiJFUzI1NiJ9.eyJleHAiOjE3NzA1MDg3OTksImp0aSI6IjAyZDkwOTM0LWM0ODgtNGZiMi1iMTExLTJjYmJjYTYwZGEwNiIsImxpY2Vuc2VkSG9zdHMiOlsiMTI3LjAuMC4xIiwibG9jYWxob3N0IiwiMTkyLjE2OC4qLioiLCIxMC4qLiouKiIsIjE3Mi4qLiouKiIsIioudGVzdCIsIioubG9jYWxob3N0IiwiKi5sb2NhbCJdLCJ1c2FnZUVuZHBvaW50IjoiaHR0cHM6Ly9wcm94eS1ldmVudC5ja2VkaXRvci5jb20iLCJkaXN0cmlidXRpb25DaGFubmVsIjpbImNsb3VkIiwiZHJ1cGFsIl0sImxpY2Vuc2VUeXBlIjoiZGV2ZWxvcG1lbnQiLCJmZWF0dXJlcyI6WyJEUlVQIl0sInZjIjoiNDM3MGQwZjAifQ.UOL-TuFiyxJR8UrIsuqtMxA1RRWSPfVfJZ_yNLaXArzgD0uKBUvQ41IRFddexL0a2wJ3Mq11ChETpl9zcySBZw', // Create a free account on https://portal.ckeditor.com/checkout?plan=free
                plugins: [ Essentials, Bold, Italic, Font, Paragraph ],
                toolbar: [
                    'undo', 'redo', '|', 'bold', 'italic', '|',
                    'fontSize', 'fontFamily', 'fontColor', 'fontBackgroundColor'
                ]
            } )
            .then( editor => {
                window.editor = editor;
            } )
            .catch( error => {
                console.error( error );
            } );
    </script>
</body>
</html>
