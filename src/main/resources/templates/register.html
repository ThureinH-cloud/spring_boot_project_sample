<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="" th:replace="/admin/header :: header"></div>
    <div class="container d-flex justify-content-center my-3">
        <div class="col-md-8 ">
            <div class="card">
                <h3 class="card-header text-center">Registration</h3>
                <div class="card-body">
                    <form th:object="${user}" th:action="@{/register/save}" method="post">
                        <div class="">
                            <label class="form-label">First Name</label>
                            <input th:field="*{firstName}" type="text" class="form-control" placeholder="Enter first Name">
                            <p th:if="${#fields.hasErrors('firstName')}" class="text-danger" th:errors="*{firstName}"></p>
                        </div>
                        <div class="">
                            <label class="form-label">Last Name</label>
                            <input th:field="*{lastName}" type="text" class="form-control" placeholder="Enter last Name">
                            <p th:if="${#fields.hasErrors('lastName')}" class="text-danger" th:errors="*{lastName}"></p>
                        </div>
                        <div class="">
                            <label class="form-label">Email</label>
                            <input th:field="*{email}" type="email" class="form-control" placeholder="Enter email address">
                            <p th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></p>
                        </div>
                        <div class="">
                            <label class="form-label">Password</label>
                            <input th:field="*{password}" type="password" class="form-control" placeholder="Enter password">
                            <p th:if="${#fields.hasErrors('password')}" class="text-danger" th:errors="*{password}"></p>
                        </div>
                        <input type="submit" value="Register" class="btn btn-primary my-2">
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
